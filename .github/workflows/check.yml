# Compila y corre las pruebas en Windows en cada push y pull request, para
# enterarse de un error antes de publicar una versión.
name: Check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Compilar
        run: cargo build --release -p neon

      - name: Compilar el instalador
        run: cargo build --release -p neon-setup

      - name: Pruebas
        run: cargo test -p neon
